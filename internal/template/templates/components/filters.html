{{ define "search-bar" }}
    <form class="scale-h relative w-full max-w-[300px] flex flex-row justify-center"  method="GET" action="/">
            <button class="absolute top-0 left-0 translate-x-[110%] translate-y-[50%]" type="submit">
                {{ template "search-icon" }}
            </button>
            
            <input class="w-full pr-(--px24) pl-[50px] py-(--px8) sharp-borders flex flex-row" type="text" name="search" placeholder="Search.." />
    </form>
{{ end }}
