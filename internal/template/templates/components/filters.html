{{ define "search-bar" }}
    <form class="w-full" method="GET" action="/">
            <input class="max-w-[300px] w-full sharp-borders px-(--px24) py-(--px8)" type="text" name="search" placeholder="Search.." />
            <input class="hidden" type="submit" placeholder="🔍" />
    </form>
    <form method="POST" action="/post">
            <input type="text" name="title" placeholder="your title here.." />
            <input type="text" name="body" placeholder="your body here.." />
            <input type="submit" placeholder="bob" />
    </form>
{{ end }}
