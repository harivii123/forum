{{ define "edit-profile" }}
{{ if .LoggedIn }}
<div id="edit-profile" popover="auto" class="edit-profile-popup">
    <h2>Edit profile</h2>

    <p>Username: {{ .User.Username }}</p>

    <form action="/profile/edit" method="POST">
        <label for="bio">About me</label>
        <textarea id="bio" name="bio" maxlength="500" rows="5">{{ .User.Bio }}</textarea>

        <div class="edit-profile-actions">
            <button type="button" popovertarget="edit-profile">
                Cancel
            </button>
            <button type="submit">Save changes</button>
        </div>
    </form>
</div>
{{ end }}
{{ end }}
