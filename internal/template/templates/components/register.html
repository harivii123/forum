{{ define "register" }}
<div class="register-container" id="register" popover="auto">
    <h1>Create an account</h1>

    <form method="POST" action="/register">
        <label for="register-username">Username</label>
        <input type="text" id="register-username" name="username" placeholder="Enter username" autocomplete="username"
            required>

        <label for="register-email">Email</label>
        <input type="email" id="register-email" name="email" placeholder="Enter email" autocomplete="email" required>

        <label for="register-password">Password</label>
        <input type="password" id="register-password" name="password" placeholder="Create password"
            autocomplete="new-password" required>

        <button class="main-btn" type="submit">Register</button>
        {{ if .AuthError }}
        <p class="auth-error" role="alert"> {{ .AuthError }} </p>
        {{ end }}
    </form>

    <p class="login-prompt"> Already have an account?
        <a class="login-link" href="/login"> Log in</a>
    </p>
</div>

{{ end }}
