{{ define "header" }}
<header class="top-0 z-10 gap-(--px16) items-center flex flex-row justify-between py-(--px8) px-(--px24)">
    <div class="w-full items-center flex flex-row gap-(--px8)">
        {{ template "logo" . }}
        {{ template "search-bar" . }}
    </div>
    {{ if not .LoggedIn }}
    <div class="flex flex-row ">
        {{ if .ShowRegister }}
        <button class="register-trigger" popovertarget="register">
            Register
        </button>
        {{else}}
        <button class="login-trigger" popovertarget="login">
            Login
        </button>
        {{end}}

        {{ template "login" . }}
        {{ template "register" . }}
    </div>
    {{ end }}
    <div class=" flex flex-row items-center {{ if .LoggedIn }}visible{{ else }}hidden{{ end }}">
        {{ template "logout" . }}
        {{ template "profile-pic" .Profile }}
    </div>
</header>
{{ end }}
